<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Hệ thống Quản lý Thư viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f8fafc; }
      .card-login { max-width: 420px; margin: 6rem auto; }
    </style>
  </head>
  <body>
    <div class="card card-login shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Đăng nhập</h4>
        <p class="text-muted">Nhập thông tin đăng nhập để truy cập hệ thống quản lý thư viện.</p>

        <div id="alertPlaceholder"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" id="loginEmail" class="form-control" required placeholder="admin@example.com">
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Mật khẩu</label>
            <input type="password" id="loginPassword" class="form-control" required placeholder="admin">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Ghi nhớ</label>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
            <button type="button" id="demoBtn" class="btn btn-outline-secondary">Đăng nhập demo</button>
          </div>
        </form>

        <hr>
        <p class="small text-muted">Nếu backend chưa có endpoint xác thực, nhấn "Đăng nhập demo" để truy cập (email: admin@example.com, mật khẩu: admin).</p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script>
      const alertPlaceholder = document.getElementById('alertPlaceholder');
      function showAlert(message, type = 'danger') {
        alertPlaceholder.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
      }

      document.getElementById('demoBtn').addEventListener('click', function() {
        // Demo login: set localStorage and redirect
        const demo = { email: 'admin@example.com', role: 'ADMIN' };
        localStorage.setItem('auth', JSON.stringify(demo));
        window.location.href = 'dashboard.html';
      });

      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        // Try backend login endpoint first
        try {
          const resp = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          if (resp.ok) {
            const data = await resp.json();
            if (document.getElementById('rememberMe').checked) {
              localStorage.setItem('auth', JSON.stringify(data));
            } else {
              sessionStorage.setItem('auth', JSON.stringify(data));
            }
            window.location.href = 'dashboard.html';
            return;
          }

          if (resp.status === 401) {
            showAlert('Thông tin đăng nhập không đúng.', 'warning');
            return;
          }
        } catch (err) {
          // network / endpoint not available - fallback to demo credentials
          console.warn('Auth endpoint not available or network error', err);
        }

        // Fallback: accept demo credentials
        if (email === 'admin@example.com' && password === 'admin') {
          const demo = { email: 'admin@example.com', role: 'ADMIN' };
          if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('auth', JSON.stringify(demo));
          } else {
            sessionStorage.setItem('auth', JSON.stringify(demo));
          }
          window.location.href = 'dashboard.html';
        } else {
          showAlert('Không thể xác thực (backend chưa có hoặc thông tin sai). Sử dụng "Đăng nhập demo" để vào.', 'danger');
        }
      });
    </script>
  </body>
</html>
