<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý Sách - Hệ thống Quản lý Thư viện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">📚 Library</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="books.html">Sách</a></li>
        <li class="nav-item"><a class="nav-link" href="users.html">Người dùng</a></li>
        <li class="nav-item"><a class="nav-link" href="borrows.html">Mượn/Trả</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>📖 Quản lý Sách</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">+ Thêm sách mới</button>
  </div>

  <div class="mb-3 d-flex gap-2">
    <input id="searchBookTitle" class="form-control" placeholder="Tìm theo tên sách...">
    <input id="searchBookAuthor" class="form-control" placeholder="Tìm theo tác giả...">
    <button class="btn btn-outline-primary" onclick="searchBooks()">🔍 Tìm kiếm</button>
    <button class="btn btn-outline-success" onclick="loadBooks()">🔄 Tất cả</button>
  </div>

  <div id="booksList" class="row g-3"></div>
</div>

<!-- Add Book Modal (Bootstrap) -->
<div class="modal fade" id="addBookModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form onsubmit="addBook(event)">
        <div class="modal-header">
          <h5 class="modal-title">Thêm sách mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tên sách *</label>
              <input type="text" id="bookTitle" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Tác giả *</label>
              <input type="text" id="bookAuthor" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">ISBN *</label>
              <input type="text" id="bookIsbn" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Nhà xuất bản</label>
              <input type="text" id="bookPublisher" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Ngày xuất bản</label>
              <input type="date" id="bookPublishDate" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Thể loại *</label>
              <input type="text" id="bookCategory" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Số lượng *</label>
              <input type="number" id="bookCopies" class="form-control" required min="1">
            </div>
            <div class="col-12">
              <label class="form-label">Mô tả</label>
              <textarea id="bookDescription" class="form-control"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Thêm</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  // Adapt displayBooks to bootstrap cards rows
  function displayBooks(books) {
    const container = document.getElementById('booksList');
    if (!books || books.length === 0) {
      container.innerHTML = '<div class="col-12"><p class="text-muted">Không có sách nào</p></div>';
      return;
    }

    container.innerHTML = books.map(book => `
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">${book.title}</h5>
            <h6 class="card-subtitle mb-2 text-muted">${book.author}</h6>
            <p class="mb-1"><strong>ISBN:</strong> ${book.isbn}</p>
            <p class="mb-1"><strong>Thể loại:</strong> ${book.category}</p>
            <p class="mb-1"><strong>Số lượng:</strong> ${book.availableCopies}/${book.totalCopies}</p>
            ${book.description ? `<p class="mt-2">${book.description}</p>` : ''}
            <div class="mt-auto d-flex gap-2">
              <button class="btn btn-danger btn-sm" onclick="deleteBook(${book.id})">Xóa</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  window.addEventListener('load', function() { loadBooks(); });
</script>
<!-- Edit Book Modal -->
<div class="modal fade" id="editBookModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form onsubmit="updateBook(event)">
        <div class="modal-header">
          <h5 class="modal-title">Sửa thông tin sách</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editBookId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tên sách *</label>
              <input type="text" id="editBookTitle" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Tác giả *</label>
              <input type="text" id="editBookAuthor" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">ISBN *</label>
              <input type="text" id="editBookIsbn" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Nhà xuất bản</label>
              <input type="text" id="editBookPublisher" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Ngày xuất bản</label>
              <input type="date" id="editBookPublishDate" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Thể loại *</label>
              <input type="text" id="editBookCategory" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Số lượng *</label>
              <input type="number" id="editBookCopies" class="form-control" required min="0">
            </div>
            <div class="col-12">
              <label class="form-label">Mô tả</label>
              <textarea id="editBookDescription" class="form-control"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
