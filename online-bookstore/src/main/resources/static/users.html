<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý Người dùng - Hệ thống Quản lý Thư viện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">📚 Library</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="books.html">Sách</a></li>
        <li class="nav-item"><a class="nav-link active" href="users.html">Người dùng</a></li>
        <li class="nav-item"><a class="nav-link" href="borrows.html">Mượn/Trả</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>👥 Quản lý Người dùng</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">+ Thêm người dùng</button>
  </div>

  <div id="usersList"></div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form onsubmit="addUser(event)">
        <div class="modal-header">
          <h5 class="modal-title">Thêm người dùng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Họ tên *</label>
            <input type="text" id="userFullName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" id="userEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu *</label>
            <input type="password" id="userPassword" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="tel" id="userPhone" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <textarea id="userAddress" class="form-control"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Vai trò *</label>
            <select id="userRole" class="form-select" required>
              <option value="MEMBER">Thành viên</option>
              <option value="LIBRARIAN">Thủ thư</option>
              <option value="ADMIN">Quản trị viên</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Thêm</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  window.addEventListener('load', function() { loadUsers(); });
</script>
<!-- Edit User Modal -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form onsubmit="updateUser(event)">
        <div class="modal-header">
          <h5 class="modal-title">Sửa người dùng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editUserId">
          <div class="mb-3">
            <label class="form-label">Họ tên *</label>
            <input type="text" id="editUserFullName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" id="editUserEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu (để trống nếu không đổi)</label>
            <input type="password" id="editUserPassword" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="tel" id="editUserPhone" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <textarea id="editUserAddress" class="form-control"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Vai trò *</label>
            <select id="editUserRole" class="form-select" required>
              <option value="MEMBER">Thành viên</option>
              <option value="LIBRARIAN">Thủ thư</option>
              <option value="ADMIN">Quản trị viên</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
